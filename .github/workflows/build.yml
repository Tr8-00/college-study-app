name: Build APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create releases and upload files
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q StudyHub.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleDebug --no-daemon
        working-directory: StudyHub
        
      - uses: actions/upload-artifact@v4
        with:
          name: study-hub-apk
          path: StudyHub/app/build/outputs/apk/debug/*.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: StudyHub/app/build/outputs/apk/debug/*.apk
          tag_name: build-${{ github.run_number }}
          name: "StudyHub Debug Build #${{ github.run_number }}"
          body: "Automated debug APK build generated successfully via GitHub Actions."
          draft: false
          prerelease: false
